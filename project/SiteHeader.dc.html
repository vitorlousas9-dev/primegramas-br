<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/primegramas-design-system-83b74fd2-7a55-4f60-bb96-d0b22ae43538/styles.css">
  <script src="_ds/primegramas-design-system-83b74fd2-7a55-4f60-bb96-d0b22ae43538/_ds_bundle.js"></script>
  <script src="icon.js"></script>
</helmet>
<header style="position:fixed;top:0;left:0;right:0;z-index:40;background:color-mix(in oklab,#fff 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border-subtle)">
  <div style="max-width:var(--container-max);margin:0 auto;padding:0 var(--gutter-inline);height:78px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:var(--space-6)">
    <a href="Inicio.dc.html" style="border:0;display:flex;align-items:center;flex-shrink:0;justify-self:start">
      <img src="assets/logo-vertical-new.png" alt="Primegramas" style="height:52px">
    </a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;gap:var(--space-6);align-items:center;justify-self:center">
        <a href="Inicio.dc.html" style="position:relative;border:0;font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--fw-semibold);color:var(--text-body);white-space:nowrap;padding-bottom:3px" style-hover="color:var(--text-strong)">Início<sc-if value="{{ isInicio }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--green-500)"></span></sc-if></a>
        <a href="Sobre.dc.html" style="position:relative;border:0;font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--fw-semibold);color:var(--text-body);white-space:nowrap;padding-bottom:3px" style-hover="color:var(--text-strong)">Sobre<sc-if value="{{ isSobre }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--green-500)"></span></sc-if></a>
        <a href="Produtos.dc.html" style="position:relative;border:0;display:flex;align-items:center;gap:4px;font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--fw-semibold);color:var(--text-body);white-space:nowrap;padding-bottom:3px" style-hover="color:var(--text-strong)">Produtos
          <x-import component-from-global-scope="PGIcon" from="./icon.js" name="chevron-down" size="14" color="var(--text-muted)" hint-size="14px,14px"></x-import>
          <sc-if value="{{ isProdutos }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--green-500)"></span></sc-if>
        </a>
        <a href="Obras.dc.html" style="position:relative;border:0;font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--fw-semibold);color:var(--text-body);white-space:nowrap;padding-bottom:3px" style-hover="color:var(--text-strong)">Obras<sc-if value="{{ isObras }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--green-500)"></span></sc-if></a>
        <a href="Contato.dc.html" style="position:relative;border:0;font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--fw-semibold);color:var(--text-body);white-space:nowrap;padding-bottom:3px" style-hover="color:var(--text-strong)">Contato<sc-if value="{{ isContato }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--green-500)"></span></sc-if></a>
      </nav>
      <div style="display:flex;align-items:center;gap:var(--space-3);flex-shrink:0;justify-self:end">
        <a href="https://wa.me/551141124329" style="border:0;display:flex;align-items:center;gap:6px;white-space:nowrap;font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--fw-semibold);color:var(--whatsapp-dark)">
          <img src="assets/whatsapp-logo-green.png" alt="" style="width:16px;height:16px">(11) 4112-4329
        </a>
        <a href="Contato.dc.html" style="border:0;display:flex;align-items:center;height:36px;padding:0 var(--space-5);border-radius:var(--radius-pill);background:var(--green-500);color:#fff;font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--fw-semibold);white-space:nowrap;box-shadow:var(--shadow-brand)" style-hover="background:var(--green-600)">Solicitar orçamento</a>
      </div>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <span aria-hidden="true"></span>
      <button onClick="{{ toggleMenu }}" aria-label="Menu" style="width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--border-default);background:#fff;border-radius:var(--radius-pill);cursor:pointer;color:var(--text-strong);justify-self:end">
        <x-import component-from-global-scope="PGIcon" from="./icon.js" name="menu" size="20" hint-size="20px,20px"></x-import>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav style="border-top:1px solid var(--border-subtle);background:#fff;padding:var(--space-4) var(--gutter-inline) var(--space-6);display:grid;gap:var(--space-1)">
      <a href="Inicio.dc.html" style="border:0;padding:var(--space-3) 0;font-family:var(--font-body);font-size:var(--text-base);font-weight:var(--fw-semibold);color:var(--text-strong);border-bottom:1px solid var(--border-subtle)">Início</a>
      <a href="Sobre.dc.html" style="border:0;padding:var(--space-3) 0;font-family:var(--font-body);font-size:var(--text-base);font-weight:var(--fw-semibold);color:var(--text-strong);border-bottom:1px solid var(--border-subtle)">Sobre</a>
      <a href="Produtos.dc.html" style="border:0;padding:var(--space-3) 0;font-family:var(--font-body);font-size:var(--text-base);font-weight:var(--fw-semibold);color:var(--text-strong);border-bottom:1px solid var(--border-subtle)">Produtos</a>
      <a href="Obras.dc.html" style="border:0;padding:var(--space-3) 0;font-family:var(--font-body);font-size:var(--text-base);font-weight:var(--fw-semibold);color:var(--text-strong);border-bottom:1px solid var(--border-subtle)">Obras</a>
      <a href="Contato.dc.html" style="border:0;padding:var(--space-3) 0;font-family:var(--font-body);font-size:var(--text-base);font-weight:var(--fw-semibold);color:var(--text-strong)">Contato</a>
      <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-3)">
        <a href="Contato.dc.html" style="border:0;display:flex;align-items:center;height:44px;padding:0 var(--space-6);border-radius:var(--radius-pill);background:var(--green-500);color:#fff;font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--fw-semibold)">Solicitar orçamento</a>
        <a href="https://wa.me/551141124329" style="border:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 var(--space-6);border-radius:var(--radius-pill);background:var(--whatsapp);color:#fff;font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--fw-semibold)">
          <img src="assets/whatsapp-icon-white.png" alt="" style="width:18px;height:18px">Falar no WhatsApp
        </a>
      </div>
    </nav>
  </sc-if>
</header>
<div style="height:79px"></div>
<a href="https://wa.me/551141124329" style="position:fixed;right:24px;bottom:24px;z-index:45;border:0;display:flex;align-items:center;gap:var(--space-3);background:var(--whatsapp);color:#fff;height:54px;padding:0 var(--space-6);border-radius:var(--radius-pill);box-shadow:var(--shadow-lg);font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--fw-semibold);letter-spacing:0.01em" style-hover="background:var(--whatsapp-dark)">
  <img src="assets/whatsapp-icon-white.png" alt="" style="width:22px;height:22px">Resposta em minutos
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;sobre&quot;,&quot;produtos&quot;,&quot;obras&quot;,&quot;depoimentos&quot;,&quot;contato&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { narrow: false, open: false };
  componentDidMount() {
    this.check = () => this.setState({ narrow: window.innerWidth < 980 });
    this.check();
    window.addEventListener('resize', this.check);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.check); }
  renderVals() {
    const a = this.props.active || '';
    return {
      wide: !this.state.narrow,
      narrow: this.state.narrow,
      menuOpen: this.state.narrow && this.state.open,
      toggleMenu: () => this.setState(s => ({ open: !s.open })),
      isInicio: a === 'inicio', isSobre: a === 'sobre', isProdutos: a === 'produtos',
      isObras: a === 'obras', isDepoimentos: a === 'depoimentos', isContato: a === 'contato'
    };
  }
}
</script>
</body>
</html>
